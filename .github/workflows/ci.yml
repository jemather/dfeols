name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.17.1"   # keep in sync with .pre-commit-config.yaml
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  typecheck:
    # Advisory until the numerical core is annotated; see [tool.mypy].
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e . mypy
      - run: mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dask,test]"
      - run: pytest

  dask:
    # The same fits through a local dask.distributed cluster.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dask,test]"
      - run: pytest --executor dask:2

  minimum-versions:
    # Oldest supported dependency versions (lower bounds in pyproject.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install -c ci/min-versions.txt -e ".[dask,test]"
      - run: pip list
      - run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Wheel contains only the package
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          bad = [n for n in names if not (n.startswith("dfeols/") or ".dist-info/" in n)]
          assert not bad, bad
          print(len(names), "files, all under dfeols/")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
