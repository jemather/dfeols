[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfeols"
version = "0.6.1"
description = "Sharded, elastic fixed-effects OLS for Slurm clusters"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "polars>=1.20",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyfixest>=0.30",
  "psutil>=5.9",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dask = ["dask>=2024.1", "distributed>=2024.1", "dask-jobqueue>=0.8"]
test = ["pytest"]

[project.scripts]
dfeols = "dfeols.cli:main"

[tool.setuptools.packages.find]
include = ["dfeols*"]
