site_name: dfeols
site_description: Sharded, elastic high-dimensional fixed-effects OLS and IV for HPC clusters
site_url: https://jemather.github.io/dfeols/
repo_url: https://github.com/jemather/dfeols
repo_name: jemather/dfeols
edit_uri: edit/main/docs/
copyright: dfeols is free software under the GPL v3 or later

docs_dir: docs
# design/ notes and ARCHITECTURE.md live in docs/ and are pages too
exclude_docs: |
  requirements.txt

theme:
  name: material
  logo: dfeols.svg
  favicon: dfeols.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Quick start: quickstart.md
      - Workflow on a cluster: guide/workflow.md
  - User guide:
      - How it works: guide/how-it-works.md
      - Formulas: guide/formulas.md
      - Planning a run: guide/planning.md
      - Site profiles: guide/site-profiles.md
      - Progress and ETA: guide/progress.md
      - Interactive sessions: guide/sessions.md
      - R client: guide/r-client.md
      - Stacked equations: guide/stacked.md
      - Poisson and cloglog: guide/glm.md
      - Discrete-time hazard models: guide/hazard.md
  - Reference:
      - reference/index.md
      - Fitting: reference/fitting.md
      - Data: reference/data.md
      - Execution: reference/execution.md
      - Sessions: reference/sessions.md
      - Records: reference/records.md
  - Performance and validation:
      - Benchmarks and performance: performance.md
      - Validation: validation.md
      - Limitations: limitations.md
  - Internals:
      - Architecture: ARCHITECTURE.md
      - Design notes:
          - Estimation records: design/estimation-format.md
          - Planner: design/planner.md
          - Sessions: design/sessions.md
          - Instrumental variables: design/iv.md
          - Varying slopes: design/slopes.md
          - Hazard models: design/hazard.md
  - Project:
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Citing and license: citing.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      # CHANGELOG.md, CONTRIBUTING.md and r/README.md stay where they are and are included
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
